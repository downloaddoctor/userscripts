<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23818cf8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2v4'/%3E%3Cpath d='M12 18v4'/%3E%3Ccircle cx='12' cy='12' r='4'/%3E%3Cpath d='M4.93 4.93l2.83 2.83'/%3E%3Cpath d='M16.24 16.24l2.83 2.83'/%3E%3Cpath d='M2 12h4'/%3E%3Cpath d='M18 12h4'/%3E%3Cpath d='M4.93 19.07l2.83-2.83'/%3E%3Cpath d='M16.24 7.76l2.83-2.83'/%3E%3C/svg%3E"
    />
    <title>Install All Userscripts — One Click Setup</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --card-bg: #151520;
        --text-primary: #e8e8f0;
        --text-secondary: #9090a0;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --success: #34d399;
        --warning: #fbbf24;
        --border: #252535;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        background-image:
          radial-gradient(ellipse at top, #1a1a2e 0%, transparent 50%),
          radial-gradient(ellipse at bottom, #1a1a2e 0%, transparent 50%);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 520px;
        width: 100%;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3rem 2.5rem;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(99, 102, 241, 0.1),
          0 0 120px rgba(99, 102, 241, 0.08);
        position: relative;
        overflow: hidden;
      }

      .container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          #6366f1,
          #34d399,
          transparent
        );
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        background: rgba(99, 102, 241, 0.15);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 32px;
        height: 32px;
        color: var(--accent-hover);
      }

      h1 {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 0.75rem;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #818cf8 0%, #34d399 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: var(--text-secondary);
        line-height: 1.6;
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      .progress-bar {
        width: 100%;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        margin: 1.5rem 0;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6366f1, #34d399);
        border-radius: 2px;
        animation: progress 2s ease-out forwards;
      }

      @keyframes progress {
        0% {
          width: 0%;
        }
        100% {
          width: 100%;
        }
      }

      .status {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--success);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .status .dot {
        width: 8px;
        height: 8px;
        background: var(--success);
        border-radius: 50%;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .popup-warning {
        margin-top: 1.5rem;
        padding: 1rem;
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 10px;
        font-size: 0.9rem;
        color: var(--warning);
        line-height: 1.6;
      }

      .popup-warning button {
        background: var(--warning);
        color: #0a0a0f;
        border: none;
        padding: 8px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        margin-top: 10px;
        transition: background 0.2s;
      }

      .popup-warning button:hover {
        background: #f59e0b;
      }

      .script-count {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 20px;
        padding: 4px 12px;
        font-size: 0.8rem;
        color: var(--accent-hover);
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 2v4"></path>
          <path d="M12 18v4"></path>
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M4.93 4.93l2.83 2.83"></path>
          <path d="M16.24 16.24l2.83 2.83"></path>
          <path d="M2 12h4"></path>
          <path d="M18 12h4"></path>
          <path d="M4.93 19.07l2.83-2.83"></path>
          <path d="M16.24 7.76l2.83-2.83"></path>
        </svg>
      </div>
      <div class="script-count">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"></path>
        </svg>
        <span>6 userscripts ready</span>
      </div>
      <h1>One Click Setup</h1>
      <p class="subtitle">
        Sit back and relax — we're opening all install tabs for you.
      </p>
      <div class="progress-bar">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="statusText">Opening tabs…</span>
      </div>
      <p class="popup-warning" id="popupWarning" style="display: none">
        No tabs opened? Your browser may have blocked pop-ups.<br />
        <strong>Allow pop-ups for this site</strong> and then
        <br />
        <button id="retryBtn" type="button">Retry</button>
      </p>
    </div>

    <script>
      const urls = [
        'https://raw.githubusercontent.com/downloaddoctor/userscripts/main/%5BCOMIC%5D%20AUTO%20SCROLL.user.js',
        'https://raw.githubusercontent.com/downloaddoctor/userscripts/main/%5BYT%5D%20CHAT.user.js',
        'https://raw.githubusercontent.com/downloaddoctor/userscripts/main/%5BYT%5D%20PLAYBACK%20SPEED.user.js',
        'https://raw.githubusercontent.com/downloaddoctor/userscripts/main/%5BMAIL%5D%20FILTER%20MENU.user.js',
        'https://raw.githubusercontent.com/downloaddoctor/userscripts/main/%5BEXNESS%5D%20TRADING%20SHORTCUTS.user.js',
        'https://raw.githubusercontent.com/downloaddoctor/userscripts/main/%5BTVC%5D%20TOOL%20SHORTCUTS.user.js',
      ]

      let popupBlocked = false

      urls.forEach((url, index) => {
        setTimeout(() => {
          const newTab = window.open(url, '_blank')
          if (
            !newTab ||
            newTab.closed ||
            typeof newTab.closed === 'undefined'
          ) {
            popupBlocked = true
          }
        }, index * 300)
      })

      setTimeout(
        () => {
          if (popupBlocked) {
            document.getElementById('popupWarning').style.display = 'block'
            document.getElementById('statusText').textContent =
              'Some tabs were blocked by your browser.'
          } else {
            document.getElementById('statusText').textContent =
              'All tabs opened! Confirm each install in Violentmonkey.'
          }
        },
        urls.length * 300 + 500,
      )

      document.getElementById('retryBtn').addEventListener('click', () => {
        document.getElementById('popupWarning').style.display = 'none'
        document.getElementById('statusText').textContent = 'Retrying…'
        popupBlocked = false

        urls.forEach((url, index) => {
          setTimeout(() => {
            const newTab = window.open(url, '_blank')
            if (
              !newTab ||
              newTab.closed ||
              typeof newTab.closed === 'undefined'
            ) {
              popupBlocked = true
            }
          }, index * 300)
        })

        setTimeout(
          () => {
            if (popupBlocked) {
              document.getElementById('popupWarning').style.display = 'block'
              document.getElementById('statusText').textContent =
                'Still blocked. Allow pop-ups in browser settings.'
            } else {
              document.getElementById('statusText').textContent =
                'All tabs opened! Confirm each install in Violentmonkey.'
            }
          },
          urls.length * 300 + 500,
        )
      })
    </script>
  </body>
</html>
